<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>KANBAN BOARD</title>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>KANBAN BOARD</h1>
            <button id="toggleModalButton">ADD NEW TASK</button>
        </div>

        <!-- Main Kanban Board Area -->
         <div class="board">
            <!-- To do section -->
             <div class="taskColumn" id="todo">
                <div class="header">
                    <span>To-Do</span>
                    <span class="count">4</span>
                </div>
                
                    <!-- Task card -->
                     <!-- Task 1 -->
                    <div class="task" draggable="true">
                        <h2>Task 1</h2>
                        <div >
                            <span>Task description will come here</span>
                            <button class="deleteTaskButton">Delete</button>

                        </div>
                    </div>

                    <!-- Task 2 -->
                    <div class="task" draggable="true">
                        <h2>Task 2</h2>
                        <div class="des">
                            <span>Task description will come here</span>
                            <button id="deleteTaskButton">Delete</button>

                        </div>
                    </div>


                

             </div>
            <!-- In-progress section -->
             <div class="taskColumn" id="inProgress">
                <div class="header">
                    <span>In-Progress</span>
                    <span class="count">4</span>
                </div>
                

             </div>
            <!-- Done section -->
             <div  class="taskColumn" id="done">
                <div class="header">
                    <span>Done</span>
                    <span class="count">4</span>
                </div>
               

             </div>
         </div>
    </div>

    <!-- Modal -->
     <div class="modal">
        <div class="bg"></div>
        <div class="center">
            <input type="text" placeholder="Enter task name" id ="taskName"/>
            <textarea placeholder="Enter task description here..." id="taskDescription"></textarea>
            <button id="addTaskButton">Add task</button>
        </div>
     </div>

    <script src="./script.js"></script>
    
</body>
</html>
